[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-inspector"
version = "0.1.0"
description = "Offline-first IOC extraction, classification, normalization and risk scoring engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ioc-inspector = "ioc_inspector.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
